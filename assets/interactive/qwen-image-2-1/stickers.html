<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Drag the cut-outs — Qwen-Image 2.1</title>
<meta name="description" content="Every object here was generated by Qwen-Image 2.1 with its own alpha channel. Drag them onto the surface; nothing is masked or pre-composited.">
<style>
  :root { --ink:#0b0e13; --panel:#12161d; --line:#242c37; --text:#e6ecf2; --dim:#94a3b1;
          --accent:#9d8cff; }
  * { box-sizing: border-box; }
  html,body { margin:0; height:100%; background:var(--ink); color:var(--text);
              font:400 16px/1.5 ui-sans-serif,system-ui,-apple-system,sans-serif; }
  #wrap { display:flex; flex-direction:column; height:100%; }
  header { padding:14px 20px; border-bottom:1px solid var(--line); display:flex;
           align-items:baseline; gap:14px; flex-wrap:wrap; }
  header h1 { font-size:17px; margin:0; font-weight:650; }
  header p { margin:0; color:var(--dim); font-size:14px; }
  header a { color:var(--accent); }
  #board { flex:1; display:flex; min-height:0; }
  /* Checkerboard, so the tray reads as transparency before anything is moved. */
  #tray { width:150px; flex:none; overflow-y:auto; padding:10px;
          border-right:1px solid var(--line);
          background:
            linear-gradient(45deg, rgba(255,255,255,.05) 25%, transparent 25% 75%, rgba(255,255,255,.05) 75%),
            linear-gradient(45deg, rgba(255,255,255,.05) 25%, transparent 25% 75%, rgba(255,255,255,.05) 75%),
            var(--panel);
          background-size:24px 24px; background-position:0 0,12px 12px; }
  #tray img { width:100%; margin-bottom:10px; cursor:grab; display:block;
              filter:drop-shadow(0 4px 10px rgba(0,0,0,.4)); touch-action:none; }
  #stage { flex:1; position:relative; overflow:hidden; background:#0d1116; }
  #stage > img.bg { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; }
  .dropped { position:absolute; cursor:grab; touch-action:none; user-select:none;
             -webkit-user-drag:none; }
  .dropped.lift { cursor:grabbing; filter:drop-shadow(0 18px 26px rgba(0,0,0,.45)); }
  footer { padding:10px 20px; border-top:1px solid var(--line); color:var(--dim); font-size:13px;
           display:flex; gap:16px; align-items:center; flex-wrap:wrap; }
  button { font:inherit; font-size:13px; color:var(--text); background:var(--panel);
           border:1px solid var(--line); border-radius:7px; padding:6px 14px; cursor:pointer; }
  button:hover { border-color:#3a4553; }
</style>
</head>
<body>
<div id="wrap">
  <header>
    <h1>Drag the cut-outs onto the surface</h1>
    <p>Every object was generated by Qwen-Image 2.1 with its own alpha channel, and the surface
       was generated too. Nothing is masked or pre-composited.
       <a href="/projects/qwen-image-2-1/">Back to the project</a></p>
  </header>
  <div id="board">
    <div id="tray"></div>
    <div id="stage"><img class="bg" src="canvas_bg.png" alt="a weathered concrete surface"></div>
  </div>
  <footer>
    <span>Drag from the left. Drag again to move something. The scroll wheel over an object
          resizes it.</span>
    <button id="clear">Clear the surface</button>
  </footer>
</div>

<script>
(function () {
  var OBJECTS = ["glass", "fern", "woman", "suitcase", "camera", "sunglasses", "thermos",
                 "cactus", "rope", "mug", "map", "teapot", "pail"];
  var tray = document.getElementById("tray"), stage = document.getElementById("stage");
  var z = 1;

  OBJECTS.forEach(function (n) {
    var im = new Image();
    im.src = "objects/" + n + ".png";
    im.alt = n;
    im.addEventListener("pointerdown", function (e) { startDrag(e, im, true); });
    tray.appendChild(im);
  });

  /* One handler for both cases: pulling a fresh copy out of the tray, and moving one already
     on the surface. `fresh` picks which. */
  function startDrag(e, src, fresh) {
    e.preventDefault();
    var box = stage.getBoundingClientRect();
    var el, offX, offY;
    if (fresh) {
      el = new Image();
      el.src = src.src;
      el.alt = src.alt;
      el.className = "dropped";
      /* Sized against the stage, not the source's own pixels, so a 1400px cut-out does not
         land filling the whole surface. */
      var w = Math.min(260, box.width * 0.22);
      el.style.width = w + "px";
      offX = w / 2;
      offY = w / 2;
      el.addEventListener("pointerdown", function (ev) { startDrag(ev, el, false); });
      el.addEventListener("wheel", function (ev) {
        ev.preventDefault();
        var cur = parseFloat(el.style.width);
        el.style.width =
          Math.max(50, Math.min(1400, cur * (ev.deltaY < 0 ? 1.08 : 0.926))) + "px";
      }, { passive: false });
      stage.appendChild(el);
    } else {
      el = src;
      var r = el.getBoundingClientRect();
      offX = e.clientX - r.left;
      offY = e.clientY - r.top;
    }
    el.style.zIndex = ++z;
    el.classList.add("lift");
    move(e);

    function move(ev) {
      el.style.left = (ev.clientX - box.left - offX) + "px";
      el.style.top = (ev.clientY - box.top - offY) + "px";
    }
    function up() {
      el.classList.remove("lift");
      window.removeEventListener("pointermove", move);
      window.removeEventListener("pointerup", up);
    }
    window.addEventListener("pointermove", move);
    window.addEventListener("pointerup", up);
  }

  document.getElementById("clear").onclick = function () {
    stage.querySelectorAll(".dropped").forEach(function (n) { n.remove(); });
  };
})();
</script>
</body>
</html>
